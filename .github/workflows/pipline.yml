name: CI
on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: |
          echo 'Running installation dependencies ...'
          yarn install --frozen-lockfile
      - name: Run Linting
        run: |
          echo 'Running linting tests ...'
          yarn run lint
        env:
          CI: true
  build:
    name: Builder
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    steps:
      - name: Clone Repository
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: |
          echo 'Resolving packages ...'
          yarn install --frozen-lockfile
      - run: |
          echo 'Creating build ...'
          yarn run build
  test:
    name: Tester
    runs-on: ubuntu-latest
    needs: [lint, build]
    env: 
      NEXT_PUBLIC_JWT_EXPIRATION: '5m'
      NEXT_PUBLIC_JWT_SECRET: 'dd5f3089-40c3-403d-af14-d0c228b05cb4'
      NEXT_PUBLIC_JWT_REFRESH_TOKEN_SECRET: '7c4c1c50-3230-45bf-9eae-c9b2e401c767'
    steps:
      - name: Clone Repository
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: |
          echo 'Running installation dependencies ...'
          yarn install --frozen-lockfile
      - name: Run Tests
        run: |
          echo 'Running jest test cases ...'
          yarn run test --runInBand
